<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>Módulo 6 — C1 a C5</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    h2 { margin: 24px 0 8px; }
    iframe { width: 100%; height: 120px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>C1 a C5</h1>

  <h2>C1 — div com fundo</h2>
  <iframe srcdoc="&lt;div style=&quot;background:#eee; padding:10px&quot;&gt;Olá módulo 6&lt;/div&gt;"></iframe>

  <h2>C2 — painel com título dentro</h2>
  <iframe srcdoc="&lt;style&gt;.panel{border:1px solid #999;padding:12px}&lt;/style&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h1&gt;Painel&lt;/h1&gt;&lt;/div&gt;"></iframe>

  <h2>C3 — dois blocos lado a lado</h2>
  <iframe srcdoc="&lt;div style=&quot;display:flex;gap:8px&quot;&gt;&lt;div style=&quot;border:1px solid #999;padding:8px&quot;&gt;A&lt;/div&gt;&lt;div style=&quot;border:1px solid #999;padding:8px&quot;&gt;B&lt;/div&gt;&lt;/div&gt;"></iframe>

  <h2>C4 — diálogo</h2>
  <iframe srcdoc="&lt;style&gt;.dialog{border:2px solid #222;padding:16px;width:200px}&lt;/style&gt;&lt;div class=&quot;dialog&quot;&gt;&lt;p&gt;Salvo&lt;/p&gt;&lt;/div&gt;"></iframe>

  <h2>C5 — botão</h2>
  <iframe srcdoc="&lt;button&gt;Salvar&lt;/button&gt;"></iframe>
  <p>O texto <code>salvou</code> não aparece aqui. Ele sai no terminal, quando o PHP chama <code>salvar()</code>.</p>
</body>
</html>
